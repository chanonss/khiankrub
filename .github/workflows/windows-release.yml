# KhianKrub: build the Windows installer and portable zip for a release tag (`v0.7.3`, or a test
# tag such as `v0.7.3-test1`) on GitHub's Windows runner, and attach them to that tag's release.
# A tag with no release yet gets a draft release; its notes, the Mac zip and publishing are done
# by hand. The files are unsigned (no signing secrets), as the PC-built ones were.
name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach to (for example v0.7.3)'
        required: true

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The tag names the version in Cargo.toml: v0.7.3 or v0.7.3-anything for 0.7.3.
      - name: Check the tag matches the version
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:TAG -ne "v$version" -and -not $env:TAG.StartsWith("v$version-")) {
            throw "tag $env:TAG does not match version $version in Cargo.toml"
          }
          "Building KhianKrub $version for $env:TAG"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-release

      - name: Install WiX 5.0.2 and its UI and Util extensions
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Build the installer and portable zip
        run: ./packaging/windows/package.ps1 -Arch x64

      - name: SHA-256 for the release notes
        run: |
          $files = Get-ChildItem dist/release/khiankrub-*-windows-x64*.msi, dist/release/khiankrub-*-windows-x64-portable.zip
          "| File | SHA-256 |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          foreach ($f in $files) {
            $sha = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLowerInvariant()
            "$($f.Name): $sha"
            "| ``$($f.Name)`` | ``$sha`` |" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Attach to the tag's release
        run: |
          $files = (Get-ChildItem dist/release/khiankrub-*-windows-x64*.msi, dist/release/khiankrub-*-windows-x64-portable.zip).FullName
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --draft --verify-tag --title "KhianKrub $env:TAG" --notes "Windows build from GitHub Actions. Add the notes and the Mac zip, then publish." @files
          } else {
            gh release upload $env:TAG --clobber @files
          }
          if ($LASTEXITCODE -ne 0) { throw "attaching the files to $env:TAG failed" }
